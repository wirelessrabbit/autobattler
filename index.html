<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Emoji Auto-Battler: Blood Rite</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  body { background-color: #0d0f12; color: #e2e8f0; display: flex; justify-content: center; align-items: center; min-height: 100vh; overflow: hidden; }
  
  #app-container { width: 100%; max-width: 420px; height: 100vh; max-height: 840px; background-color: #12161f; display: flex; flex-direction: column; position: relative; border: 1px solid #2a3245; border-radius: 12px; overflow: hidden; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
  
  /* Header HUD */
  header { background: #1a202c; padding: 10px 14px; border-bottom: 1px solid #2d3748; display: flex; justify-content: space-between; align-items: center; z-index: 10; }
  .hud-stat { display: flex; align-items: center; gap: 4px; font-weight: bold; font-size: 14px; }
  .gold-stat { color: #f6ad55; }
  .wave-stat { color: #63b3ed; }
  .army-stat { color: #9ae6b4; }

  /* Main Canvas Area */
  #arena-wrapper { position: relative; flex: 1; background: #1a202c; width: 100%; height: 100%; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; background: radial-gradient(circle, #1e2638 0%, #111521 100%); }

  /* Log Overlay */
  #combat-log { position: absolute; top: 8px; left: 8px; right: 8px; height: 50px; overflow-y: auto; pointer-events: none; font-size: 11px; color: #a0aec0; display: flex; flex-direction: column-reverse; }
  .log-entry { background: rgba(0,0,0,0.4); padding: 2px 6px; border-radius: 4px; margin-top: 2px; }

  /* Bottom Controls & Shop */
  #control-panel { background: #171923; border-top: 1px solid #2d3748; padding: 10px; display: flex; flex-direction: column; gap: 8px; z-index: 10; }
  
  .action-row { display: flex; gap: 8px; }
  .btn { flex: 1; padding: 10px; border: none; border-radius: 8px; font-weight: bold; font-size: 13px; cursor: pointer; transition: all 0.15s ease; display: flex; justify-content: center; align-items: center; gap: 4px; }
  .btn-primary { background: #3182ce; color: white; }
  .btn-primary:hover { background: #2b6cb0; }
  .btn-reroll { background: #d69e2e; color: white; }
  .btn-reroll:hover { background: #b7791f; }
  .btn-danger { background: #e53e3e; color: white; }
  .btn-danger:hover { background: #c53030; }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }

  /* Shop Grid */
  .shop-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .shop-card { background: #2d3748; border: 1px solid #4a5568; border-radius: 8px; padding: 6px 4px; display: flex; flex-direction: column; align-items: center; cursor: pointer; position: relative; transition: transform 0.1s; }
  .shop-card:hover { transform: translateY(-2px); border-color: #63b3ed; }
  .shop-emoji { font-size: 24px; margin-bottom: 2px; }
  .shop-name { font-size: 10px; font-weight: bold; text-align: center; color: #e2e8f0; white-content: nowrap; overflow: hidden; text-overflow: ellipsis; width: 100%; }
  .shop-cost { font-size: 11px; font-weight: bold; color: #f6ad55; margin-top: 2px; }

  /* Stat Inspector Side Panel / Modal */
  #stat-inspector { position: absolute; bottom: 120px; left: 10px; right: 10px; background: rgba(23, 25, 35, 0.95); border: 1px solid #4a5568; border-radius: 10px; padding: 10px; display: none; z-index: 20; backdrop-filter: blur(4px); font-size: 12px; }
  #stat-inspector.active { display: block; }
  .inspector-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #4a5568; padding-bottom: 4px; margin-bottom: 6px; }
  .inspector-title { font-weight: bold; font-size: 14px; display: flex; align-items: center; gap: 6px; }
  .inspector-classes { font-size: 10px; color: #cbd5e0; margin-bottom: 6px; }
  .inspector-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; margin-bottom: 6px; text-align: center; }
  .stat-box { background: #2d3748; padding: 4px; border-radius: 4px; }
  .stat-label { font-size: 9px; color: #a0aec0; }
  .stat-val { font-weight: bold; color: #63b3ed; }
  .inspector-passives { font-size: 10px; color: #e2e8f0; border-top: 1px dashed #4a5568; padding-top: 4px; }

  /* Blood Rite Modal Overlay */
  #blood-rite-overlay { position: absolute; inset: 0; background: rgba(10, 10, 15, 0.92); display: none; flex-direction: column; padding: 16px; z-index: 30; backdrop-filter: blur(6px); }
  #blood-rite-overlay.active { display: flex; }
  .rite-header { text-align: center; margin-bottom: 12px; }
  .rite-title { font-size: 20px; font-weight: bold; color: #fc8181; text-transform: uppercase; letter-spacing: 1px; }
  .god-card { background: #2c1517; border: 1px solid #9b2c2c; border-radius: 8px; padding: 8px; margin-bottom: 12px; text-align: center; }
  .god-name { font-weight: bold; color: #feb2b2; font-size: 14px; }
  .god-desc { font-size: 11px; color: #e2e8f0; margin-top: 2px; }
  .rite-counter { font-size: 12px; text-align: center; color: #cbd5e0; margin-bottom: 8px; }

  .sacrifice-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
  .sacrifice-item { background: #1a202c; border: 1px solid #2d3748; border-radius: 8px; padding: 8px; display: flex; justify-content: space-between; align-items: center; }
  .sacrifice-info { display: flex; align-items: center; gap: 8px; }
  .sacrifice-btn { background: #9b2c2c; color: white; border: none; padding: 6px 12px; border-radius: 6px; font-weight: bold; font-size: 12px; cursor: pointer; }
  .sacrifice-btn:hover { background: #c53030; }
  .sacrifice-btn:disabled { opacity: 0.4; cursor: not-allowed; }
</style>
</head>
<body>

<div id="app-container">
  <!-- Header HUD -->
  <header>
    <div class="hud-stat gold-stat">🪙 <span id="gold-val">15</span></div>
    <div class="hud-stat wave-stat">⚔️ Wave <span id="wave-val">1</span></div>
    <div class="hud-stat army-stat">🪖 Army <span id="army-val">0</span>/<span id="army-max">8</span></div>
  </header>

  <!-- Arena Canvas View -->
  <div id="arena-wrapper">
    <canvas id="arena"></canvas>
    <div id="combat-log"></div>
  </div>

  <!-- Dynamic Inspector Card -->
  <div id="stat-inspector">
    <div class="inspector-header">
      <div class="inspector-title"><span id="insp-icon">⚔️</span> <span id="insp-name">Fighter</span></div>
      <div id="insp-cost" class="shop-cost">Cost: 3G</div>
    </div>
    <div class="inspector-classes" id="insp-classes">Blade Mastery, Vanguard</div>
    <div class="inspector-stats">
      <div class="stat-box"><div class="stat-label">HP</div><div class="stat-val" id="insp-hp">10</div></div>
      <div class="stat-box"><div class="stat-label">ARMOR</div><div class="stat-val" id="insp-armor">2</div></div>
      <div class="stat-box"><div class="stat-label">DMG</div><div class="stat-val" id="insp-dmg">3</div></div>
      <div class="stat-box"><div class="stat-label">RNG</div><div class="stat-val" id="insp-rng">25</div></div>
      <div class="stat-box"><div class="stat-label">ATK/S</div><div class="stat-val" id="insp-spd">3.0</div></div>
      <div class="stat-box"><div class="stat-label">SPEC</div><div class="stat-val" id="insp-spec">0</div></div>
    </div>
    <div class="inspector-passives" id="insp-passives"></div>
  </div>

  <!-- Bottom Shop & Controls -->
  <div id="control-panel">
    <div class="shop-grid" id="shop-container"></div>
    <div class="action-row">
      <button class="btn btn-reroll" id="btn-reroll">🎲 Reroll (5G)</button>
      <button class="btn btn-primary" id="btn-fight">⚔️ Start Battle</button>
    </div>
  </div>

  <!-- Blood Rite Modal -->
  <div id="blood-rite-overlay">
    <div class="rite-header">
      <div class="rite-title">🩸 The Blood Rite</div>
      <div style="font-size:11px; color:#a0aec0; margin-top:2px;">A Warlock demands a sacrifice for the Gods</div>
    </div>
    <div class="god-card">
      <div class="god-name" id="god-name">Blood God</div>
      <div class="god-desc" id="god-desc">+30% Max HP, -15% Movespeed</div>
    </div>
    <div class="rite-counter">Sacrifices remaining: <span id="sac-left" style="color:#fc8181; font-weight:bold;">1</span></div>
    <div class="sacrifice-list" id="sacrifice-list"></div>
    <button class="btn btn-primary" id="btn-finish-rite" style="margin-top:12px;">Complete Rite</button>
  </div>
</div>

<script>
// --- DATABASE & UNIT REGISTRY ---
const UNIT_TYPES = {
  fighter: {
    id: 'fighter', name: 'Fighter', icon: '🤺', cost: 3,
    classes: ['Blade Mastery', 'Vanguard'],
    hp: 10, armor: 2, damage: 3, range: 25, attackSpeed: 3.0, special: 0, moveSpeed: 90,
    desc: 'Bloodlust: Heals 0.5 HP if an enemy dies within 50px.'
  },
  archer: {
    id: 'archer', name: 'Archer', icon: '🏹', cost: 5,
    classes: ['Sharpeye', 'Nature'],
    hp: 6, armor: 0, damage: 4, range: 200, attackSpeed: 1.8, special: 2, moveSpeed: 80,
    desc: 'Critical Eye: Special gives +15% Crit Chance & +10% Crit DMG.'
  },
  mage: {
    id: 'mage', name: 'Mage', icon: '🧙‍♂️', cost: 6,
    classes: ['Magic', 'Arcane'],
    hp: 5, armor: -1, damage: 1, range: 170, attackSpeed: 1.0, special: 6, moveSpeed: 70,
    desc: 'Arcane Supremacy & Multicast: Uses Special for DMG. Every Special point gives +6.66% Multicast Chance.'
  },
  healer: {
    id: 'healer', name: 'Healer', icon: '💚', cost: 5,
    classes: ['Savior', 'Support'],
    hp: 7, armor: 1, damage: 1, range: 180, attackSpeed: 0.8, special: 5, moveSpeed: 75,
    desc: 'Healing Scroll: Heals lowest HP ally every 2.5s equal to (0.4 * Special HP).'
  },
  rogue: {
    id: 'rogue', name: 'Rogue', icon: '🗡️', cost: 3,
    classes: ['Blade Mastery', 'Shadow'],
    hp: 4, armor: 1, damage: 5, range: 25, attackSpeed: 1.5, special: 2, moveSpeed: 110,
    desc: 'Smoke Bomb & Poison: Ignored for first 5s. Attacks poison targets ignoring armor.'
  },
  barbarian: {
    id: 'barbarian', name: 'Barbarian', icon: '🪓', cost: 5,
    classes: ['Brute', 'Vanguard'],
    hp: 12, armor: 0, damage: 2, range: 35, attackSpeed: 2.6, special: 3, moveSpeed: 75,
    desc: 'Induce Rage & Warrior Blood: Taunts nearby enemies. Uses Special Stat for Damage Reduction.'
  },
  druid: {
    id: 'druid', name: 'Druid', icon: '🌿', cost: 4,
    classes: ['Nature', 'Magic', 'Support'],
    hp: 6, armor: 0, damage: 3, range: 180, attackSpeed: 1.1, special: 5, moveSpeed: 70,
    desc: "Nature's Touch: Grants allies bonus armor (+0.2 * Special) that lasts until struck."
  },
  warlock: {
    id: 'warlock', name: 'Warlock', icon: '🔮', cost: 8,
    classes: ['Magic', 'Shadow'],
    hp: 20, armor: 0, damage: 6, range: 170, attackSpeed: 1.0, special: 5, moveSpeed: 70,
    desc: 'Blood Curse: Loses 1 HP per attack. Curses enemies dealing DoT and healing self.'
  }
};

const GODS = {
  blood: { name: 'Blood God 🩸', desc: '+30% Base HP, -15% Movespeed', apply: s => { s.hpMultiplier *= 1.3; s.moveSpeedMultiplier *= 0.85; } },
  lightning: { name: 'Lightning God ⚡', desc: '+25% Movespeed, +30% Attack Speed, -15% Damage', apply: s => { s.moveSpeedMultiplier *= 1.25; s.attackSpeedMultiplier *= 1.3; s.damageMultiplier *= 0.85; } },
  rage: { name: 'Rage God 💢', desc: '+35% Damage, +2 Flat Armor, -20% Base HP', apply: s => { s.damageMultiplier *= 1.35; s.bonusArmor += 2; s.hpMultiplier *= 0.80; } }
};

// Global Game State
let gameState = {
  gold: 15,
  wave: 1,
  maxArmySize: 8,
  army: [],
  shop: [],
  godBuffs: {}, // { unitTypeId: { hpMultiplier, damageMultiplier, moveSpeedMultiplier, attackSpeedMultiplier, bonusArmor } }
  phase: 'shop', // 'shop', 'combat', 'rite'
  riteCount: 0,
  currentGod: null,
  sacrificesRemaining: 0
};

// Initialize God Buff registry per unit type
Object.keys(UNIT_TYPES).forEach(id => {
  gameState.godBuffs[id] = { hpMultiplier: 1, damageMultiplier: 1, moveSpeedMultiplier: 1, attackSpeedMultiplier: 1, bonusArmor: 0 };
});

// Setup Canvas Engine
const canvas = document.getElementById('arena');
const ctx = canvas.getContext('2d');
let animFrameId = null;
let lastTime = 0;

function resizeCanvas() {
  const rect = canvas.parentElement.getBoundingClientRect();
  canvas.width = rect.width;
  canvas.height = rect.height;
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

// Active Combat Simulator Storage
let combatUnits = [];
let projectiles = [];
let floatTexts = [];
let combatTimer = 0;

// --- UTILITY & DAMAGE FORMULA ---
function logMsg(msg) {
  const logEl = document.getElementById('combat-log');
  const entry = document.createElement('div');
  entry.className = 'log-entry';
  entry.innerText = msg;
  logEl.prepend(entry);
  if (logEl.children.length > 15) logEl.removeChild(logEl.lastChild);
}

function calculateDamage(rawDmg, armor) {
  if (armor >= 0) {
    return Math.max(0.1, rawDmg - (armor * 0.5));
  } else {
    return rawDmg + Math.abs(armor);
  }
}

// Get Buffed Base Stats for a Unit Instance
function getEffectiveStats(typeId) {
  const base = UNIT_TYPES[typeId];
  const buffs = gameState.godBuffs[typeId];
  return {
    ...base,
    hp: Math.round(base.hp * buffs.hpMultiplier),
    damage: Math.max(1, Math.round(base.damage * buffs.damageMultiplier)),
    armor: base.armor + buffs.bonusArmor,
    attackSpeed: Number((base.attackSpeed * buffs.attackSpeedMultiplier).toFixed(2)),
    moveSpeed: Math.round(base.moveSpeed * buffs.moveSpeedMultiplier)
  };
}

// --- SHOP & ARMY MANAGEMENT ---
function refreshShop() {
  const keys = Object.keys(UNIT_TYPES);
  gameState.shop = [];
  for (let i = 0; i < 4; i++) {
    const randomKey = keys[Math.floor(Math.random() * keys.length)];
    gameState.shop.push(UNIT_TYPES[randomKey]);
  }
  renderShop();
}

function renderShop() {
  const container = document.getElementById('shop-container');
  container.innerHTML = '';
  gameState.shop.forEach((unit, idx) => {
    const card = document.createElement('div');
    card.className = 'shop-card';
    card.innerHTML = `
      <div class="shop-emoji">${unit.icon}</div>
      <div class="shop-name">${unit.name}</div>
      <div class="shop-cost">${unit.cost}G</div>
    `;
    card.onclick = () => buyUnit(idx);
    card.onmouseenter = () => inspectUnit(unit.id);
    container.appendChild(card);
  });
  updateHUD();
}

function inspectUnit(typeId) {
  const stats = getEffectiveStats(typeId);
  document.getElementById('insp-icon').innerText = stats.icon;
  document.getElementById('insp-name').innerText = stats.name;
  document.getElementById('insp-cost').innerText = `Cost: ${stats.cost}G`;
  document.getElementById('insp-classes').innerText = stats.classes.join(' • ');
  document.getElementById('insp-hp').innerText = stats.hp;
  document.getElementById('insp-armor').innerText = stats.armor;
  document.getElementById('insp-dmg').innerText = stats.damage;
  document.getElementById('insp-rng').innerText = stats.range;
  document.getElementById('insp-spd').innerText = stats.attackSpeed;
  document.getElementById('insp-spec').innerText = stats.special;
  document.getElementById('insp-passives').innerText = stats.desc;
  document.getElementById('stat-inspector').classList.add('active');
}

function buyUnit(shopIdx) {
  const unit = gameState.shop[shopIdx];
  if (!unit) return;
  if (gameState.army.length >= gameState.maxArmySize) {
    logMsg('🚫 Army is full!');
    return;
  }
  if (gameState.gold < unit.cost) {
    logMsg('🪙 Not enough Gold!');
    return;
  }
  gameState.gold -= unit.cost;
  gameState.army.push(unit.id);
  logMsg(`Recruited ${unit.icon} ${unit.name}`);
  updateHUD();
}

function updateHUD() {
  document.getElementById('gold-val').innerText = gameState.gold;
  document.getElementById('wave-val').innerText = gameState.wave;
  document.getElementById('army-val').innerText = gameState.army.length;
  document.getElementById('army-max').innerText = gameState.maxArmySize;
  
  document.getElementById('btn-reroll').disabled = gameState.gold < 5 || gameState.phase !== 'shop';
  document.getElementById('btn-fight').disabled = gameState.phase !== 'shop';
}

document.getElementById('btn-reroll').onclick = () => {
  if (gameState.gold >= 5 && gameState.phase === 'shop') {
    gameState.gold -= 5;
    refreshShop();
  }
};

document.getElementById('btn-fight').onclick = () => {
  if (gameState.phase === 'shop') startCombatPhase();
};

// --- BLOOD RITE SYSTEM ---
function checkBloodRiteTrigger() {
  if (gameState.wave % 5 === 0 && gameState.army.length > 0) {
    triggerBloodRite();
  } else {
    startNextShopPhase();
  }
}

function triggerBloodRite() {
  gameState.phase = 'rite';
  gameState.riteCount++;
  const godKeys = Object.keys(GODS);
  gameState.currentGod = GODS[godKeys[Math.floor(Math.random() * godKeys.length)]];
  gameState.sacrificesRemaining = Math.min(gameState.riteCount, 5);

  document.getElementById('god-name').innerText = gameState.currentGod.name;
  document.getElementById('god-desc').innerText = gameState.currentGod.desc;
  renderSacrificeList();
  document.getElementById('blood-rite-overlay').classList.add('active');
}

function renderSacrificeList() {
  document.getElementById('sac-left').innerText = gameState.sacrificesRemaining;
  const listEl = document.getElementById('sacrifice-list');
  listEl.innerHTML = '';

  // Group current army by type
  const counts = {};
  gameState.army.forEach(id => counts[id] = (counts[id] || 0) + 1);

  Object.keys(counts).forEach(typeId => {
    const unit = UNIT_TYPES[typeId];
    const item = document.createElement('div');
    item.className = 'sacrifice-item';
    item.innerHTML = `
      <div class="sacrifice-info">
        <span style="font-size:20px;">${unit.icon}</span>
        <div>
          <div style="font-weight:bold; font-size:13px;">${unit.name}</div>
          <div style="font-size:10px; color:#a0aec0;">Owned: ${counts[typeId]}</div>
        </div>
      </div>
      <button class="sacrifice-btn" ${gameState.sacrificesRemaining <= 0 ? 'disabled' : ''}>Sacrifice</button>
    `;
    item.querySelector('.sacrifice-btn').onclick = () => sacrificeUnit(typeId);
    listEl.appendChild(item);
  });
}

function sacrificeUnit(typeId) {
  if (gameState.sacrificesRemaining <= 0) return;
  const idx = gameState.army.indexOf(typeId);
  if (idx !== -1) {
    gameState.army.splice(idx, 1);
    gameState.currentGod.apply(gameState.godBuffs[typeId]);
    gameState.sacrificesRemaining--;
    logMsg(`🩸 Sacrificed ${UNIT_TYPES[typeId].name} to ${gameState.currentGod.name}`);
    renderSacrificeList();
    updateHUD();
  }
}

document.getElementById('btn-finish-rite').onclick = () => {
  document.getElementById('blood-rite-overlay').classList.remove('active');
  startNextShopPhase();
};

function startNextShopPhase() {
  gameState.phase = 'shop';
  gameState.wave++;
  gameState.maxArmySize += 2; // Army grows by 2 per wave
  gameState.gold += 10 + Math.floor(gameState.wave * 1.5);
  refreshShop();
  updateHUD();
}

// --- COMBAT ENGINE & CANVAS ANIMATION ---
function startCombatPhase() {
  gameState.phase = 'combat';
  document.getElementById('stat-inspector').classList.remove('active');
  updateHUD();

  combatUnits = [];
  projectiles = [];
  floatTexts = [];
  combatTimer = 0;

  // Instantiate Player Units
  gameState.army.forEach((typeId, index) => {
    const stats = getEffectiveStats(typeId);
    combatUnits.push({
      ...stats,
      isEnemy: false,
      x: 40 + Math.random() * (canvas.width - 80),
      y: canvas.height - 60 - Math.random() * 80,
      currentHp: stats.hp,
      maxHp: stats.hp,
      cooldown: 0,
      hopTimer: Math.random() * Math.PI,
      curseTimer: 0,
      bonusArmor: 0,
      smokeTimer: typeId === 'rogue' ? 5.0 : 0
    });
  });

  // Spawn Enemy Mobs
  const enemyCount = Math.max(2, Math.floor(gameState.army.length * 0.8) + Math.floor(gameState.wave * 0.5));
  for (let i = 0; i < enemyCount; i++) {
    const mobHp = Math.round(12 * Math.pow(1.15, gameState.wave - 1));
    const mobDmg = Math.round(3 * Math.pow(1.10, gameState.wave - 1));
    combatUnits.push({
      id: 'mob', name: 'Goblin', icon: '👹', isEnemy: true,
      hp: mobHp, currentHp: mobHp, maxHp: mobHp,
      damage: mobDmg, armor: Math.floor(gameState.wave / 4),
      range: 25, attackSpeed: 1.2, moveSpeed: 60, special: 0,
      x: 40 + Math.random() * (canvas.width - 80),
      y: 40 + Math.random() * 80,
      cooldown: 0, hopTimer: Math.random() * Math.PI,
      curseDoT: 0
    });
  }

  // Trigger Druid Start-of-Combat Passives
  combatUnits.filter(u => !u.isEnemy && u.id === 'druid').forEach(druid => {
    const allies = combatUnits.filter(u => !u.isEnemy);
    if (allies.length > 0) {
      const target = allies[Math.floor(Math.random() * allies.length)];
      target.bonusArmor += Math.round(druid.special * 0.2);
      addFloatText(target.x, target.y, `🛡️+${Math.round(druid.special * 0.2)}`, '#63b3ed');
    }
  });

  lastTime = performance.now();
  requestAnimationFrame(gameLoop);
}

function gameLoop(time) {
  const dt = Math.min((time - lastTime) / 1000, 0.1);
  lastTime = time;

  updateCombat(dt);
  renderCombat();

  const playersAlive = combatUnits.some(u => !u.isEnemy && u.currentHp > 0);
  const enemiesAlive = combatUnits.some(u => u.isEnemy && u.currentHp > 0);

  if (playersAlive && enemiesAlive) {
    animFrameId = requestAnimationFrame(gameLoop);
  } else {
    setTimeout(() => {
      if (playersAlive) {
        logMsg('🎉 Wave Victory!');
        checkBloodRiteTrigger();
      } else {
        logMsg('💀 Defeat! Game Reset.');
        gameState.wave = 1;
        gameState.gold = 15;
        gameState.maxArmySize = 8;
        gameState.army = [];
        startNextShopPhase();
      }
    }, 1000);
  }
}

function updateCombat(dt) {
  combatTimer += dt;

  // Update Units
  combatUnits.forEach(u => {
    if (u.currentHp <= 0) return;

    u.cooldown -= dt;
    u.hopTimer += dt * 8;
    if (u.smokeTimer > 0) u.smokeTimer -= dt;

    // DoT Curse Handler
    if (u.curseDoT > 0) {
      u.curseTimer = (u.curseTimer || 0) + dt;
      if (u.curseTimer >= 0.8) {
        u.curseTimer = 0;
        u.currentHp -= u.curseDoT;
        addFloatText(u.x, u.y, `💜${u.curseDoT.toFixed(1)}`, '#b794f4');
      }
    }

    // Target Acquisition
    let targets = combatUnits.filter(t => t.isEnemy !== u.isEnemy && t.currentHp > 0);
    if (!u.isEnemy) targets = targets.filter(t => t.smokeTimer <= 0 || targets.length === 1);

    if (targets.length === 0) return;

    // Find closest target
    let closest = targets[0];
    let minDist = Math.hypot(closest.x - u.x, closest.y - u.y);
    for (let i = 1; i < targets.length; i++) {
      const d = Math.hypot(targets[i].x - u.x, targets[i].y - u.y);
      if (d < minDist) { minDist = d; closest = targets[i]; }
    }

    // Movement or Attack Action
    if (minDist > u.range) {
      const angle = Math.atan2(closest.y - u.y, closest.x - u.x);
      u.x += Math.cos(angle) * u.moveSpeed * dt;
      u.y += Math.sin(angle) * u.moveSpeed * dt;
    } else if (u.cooldown <= 0) {
      u.cooldown = 1 / u.attackSpeed;

      // Class Ability Calculations
      if (u.id === 'mage') {
        const multicasts = Math.floor((u.special * 6.66) / 100) + (Math.random() < ((u.special * 6.66) % 100) / 100 ? 1 : 0);
        for (let m = 0; m <= multicasts; m++) {
          projectiles.push({ x: u.x, y: u.y, tx: closest.x, ty: closest.y, speed: 200, damage: u.special, isEnemy: u.isEnemy, color: '#9f7aea' });
        }
      } else if (u.id === 'archer') {
        const critChance = u.special * 0.15;
        const isCrit = Math.random() < critChance;
        const dmg = isCrit ? u.damage * (2 + u.special * 0.1) : u.damage;
        projectiles.push({ x: u.x, y: u.y, tx: closest.x, ty: closest.y, speed: 250, damage: dmg, isEnemy: u.isEnemy, color: '#f6ad55', isCrit });
      } else if (u.id === 'healer') {
        const allies = combatUnits.filter(a => a.isEnemy === u.isEnemy && a.currentHp > 0).sort((a,b) => (a.currentHp/a.maxHp) - (b.currentHp/b.maxHp));
        if (allies.length > 0) {
          const healAmount = Math.floor(0.4 * u.special);
          allies[0].currentHp = Math.min(allies[0].maxHp, allies[0].currentHp + healAmount);
          addFloatText(allies[0].x, allies[0].y, `💚+${healAmount}`, '#68d391');
        }
      } else if (u.id === 'rogue') {
        const poisonDmg = (1.2 * u.special) / 2;
        closest.curseDoT = (closest.curseDoT || 0) + poisonDmg;
        executeAttack(u, closest, u.damage);
      } else if (u.id === 'warlock') {
        if (u.currentHp > 1) u.currentHp -= 1;
        closest.curseDoT = u.special * 0.3;
        executeAttack(u, closest, u.damage);
      } else {
        executeAttack(u, closest, u.damage);
      }
    }
  });

  // Projectiles Flight Update
  projectiles.forEach(p => {
    const dx = p.tx - p.x;
    const dy = p.ty - p.y;
    const dist = Math.hypot(dx, dy);
    if (dist < 5) {
      p.hit = true;
      const target = combatUnits.find(u => Math.hypot(u.x - p.tx, u.y - p.ty) < 20 && u.isEnemy !== p.isEnemy && u.currentHp > 0);
      if (target) executeAttack({ damage: p.damage }, target, p.damage, p.isCrit);
    } else {
      p.x += (dx / dist) * p.speed * dt;
      p.y += (dy / dist) * p.speed * dt;
    }
  });
  projectiles = projectiles.filter(p => !p.hit);

  // Floating Text Timers
  floatTexts.forEach(ft => { ft.y -= 20 * dt; ft.life -= dt; });
  floatTexts = floatTexts.filter(ft => ft.life > 0);
}

function executeAttack(attacker, target, rawDmg, isCrit = false) {
  const effectiveArmor = (target.id === 'barbarian') ? target.special : target.armor + (target.bonusArmor || 0);
  const finalDmg = calculateDamage(rawDmg, effectiveArmor);
  
  target.currentHp -= finalDmg;
  if (target.bonusArmor > 0) target.bonusArmor = 0; // Strip Druid armor on hit

  addFloatText(target.x, target.y, `${isCrit ? '💥' : ''}${finalDmg.toFixed(1)}`, isCrit ? '#f6e05e' : '#e53e3e');

  // Fighter Bloodlust Passive Check
  if (target.currentHp <= 0) {
    combatUnits.filter(u => u.id === 'fighter' && u.isEnemy !== target.isEnemy && Math.hypot(u.x - target.x, u.y - target.y) <= 50).forEach(f => {
      const heal = 0.5 + f.special * 0.1;
      f.currentHp = Math.min(f.maxHp, f.currentHp + heal);
      addFloatText(f.x, f.y, `🩸+${heal.toFixed(1)}`, '#fc8181');
    });
  }
}

function addFloatText(x, y, text, color) {
  floatTexts.push({ x, y, text, color, life: 0.8 });
}

function renderCombat() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // Render Projectiles
  projectiles.forEach(p => {
    ctx.fillStyle = p.color || '#fff';
    ctx.beginPath();
    ctx.arc(p.x, p.y, 4, 0, Math.PI * 2);
    ctx.fill();
  });

  // Render Units
  combatUnits.forEach(u => {
    if (u.currentHp <= 0) return;

    const hopY = Math.abs(Math.sin(u.hopTimer)) * 6;
    ctx.font = '24px serif';
    ctx.textAlign = 'center';
    ctx.fillText(u.icon, u.x, u.y - hopY);

    // Health Bar
    const hpPct = Math.max(0, u.currentHp / u.maxHp);
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.fillRect(u.x - 15, u.y - hopY + 4, 30, 4);
    ctx.fillStyle = u.isEnemy ? '#e53e3e' : '#48bb78';
    ctx.fillRect(u.x - 15, u.y - hopY + 4, 30 * hpPct, 4);
  });

  // Render Floating Damage/Heal Numbers
  floatTexts.forEach(ft => {
    ctx.font = 'bold 12px sans-serif';
    ctx.fillStyle = ft.color;
    ctx.textAlign = 'center';
    ctx.fillText(ft.text, ft.x, ft.y);
  });
}

// Initial Launch Setup
refreshShop();
</script>
